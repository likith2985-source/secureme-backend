name: SecureMe Backend Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pandas openpyxl httpx

    - name: Run Tests
      run: |
        python -m pytest tests/
      env:
        DATABASE_URL: sqlite:///./test.db
        BREVO_API_KEY: ""
        PYTHONPATH: .

    - name: Write Job Summary
      if: always()
      run: |
        if [ -f "test_reports/step_summary.md" ]; then
          cat test_reports/step_summary.md >> $GITHUB_STEP_SUMMARY
        else
          echo "Summary file not found." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: test_reports/
